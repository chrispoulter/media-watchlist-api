services:
    media-watchlist-api:
        image: media-watchlist-api:latest
        build:
            context: .
        environment:
            PORT: 3000
            DATABASE_URL: postgresql://postgres:password@postgres:5432/media_watchlist
            BETTER_AUTH_URL: http://localhost:3000
            BETTER_AUTH_SECRET: change-me-to-a-secret-that-is-at-least-32-chars
            CLIENT_ORIGIN: http://localhost:3000,http://localhost:5173
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
            TMDB_API_READ_TOKEN: ${TMDB_API_READ_TOKEN:-your-tmdb-api-read-token}
            SMTP_HOST: mailpit
            SMTP_PORT: 1025
            SMTP_FROM: noreply@example.com
            LOG_LEVEL: info
            OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:4317
        ports:
            - 3000:3000
        depends_on:
            postgres:
                condition: service_healthy
            mailpit:
                condition: service_started
            aspire-dashboard:
                condition: service_started
            media-watchlist-migrate:
                condition: service_completed_successfully

    media-watchlist-migrate:
        image: media-watchlist-api:latest
        build:
            context: .
        command: node dist/src/db/migrate.js
        environment:
            DATABASE_URL: postgresql://postgres:password@postgres:5432/media_watchlist
        depends_on:
            postgres:
                condition: service_healthy
        restart: no

    postgres:
        image: postgres:18.3
        user: postgres
        environment:
            POSTGRES_DB: media_watchlist
            POSTGRES_PASSWORD: password
        ports:
            - 5432:5432
        volumes:
            - postgres_data:/var/lib/postgresql
        restart: always
        healthcheck:
            test: ['CMD', 'pg_isready']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s

    mailpit:
        image: axllent/mailpit:v1.22.3
        environment:
            MP_DATABASE: /data/mailpit.db
        ports:
            - 1025:1025
            - 8025:8025
        volumes:
            - mailpit_data:/data
        restart: always

    aspire-dashboard:
        image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
        environment:
            DASHBOARD__FRONTEND__AUTHMODE: Unsecured
            DASHBOARD__OTLP__AUTHMODE: Unsecured
        ports:
            - 18888:18888 
            - 4317:18889 
            - 4318:18890
        restart: always

volumes:
    postgres_data:
    mailpit_data:
